<text x="75" y="776" font-weight="700" font-size="25" fill="#3A5A40">Typography &amp; usage</text>
<text x="75" y="812" font-size="18" fill="#3A5A40">Suggested typeface: Nunito Sans ExtraBold (800). Rounded alternatives: Nunito / Arial Rounded.</text>
<text x="75" y="846" font-size="18" fill="#3A5A40">SVG paths are editable; wordmark is live SVG text. Outlining text is recommended for production.</text>
<text x="75" y="880" font-size="18" fill="#3A5A40">Use the standalone icon at small sizes, and the full wordmark in headers and presentations.</text>
