[project]
name = "campus-bites-api"
version = "0.1.0"
description = "Campus Bites business API (rebates, complaint workflow, nudges, escalations, push)."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "supabase>=2.33.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
# En dash is intentional in user-facing time ranges ("8:00 AM – 10:00 AM").
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
